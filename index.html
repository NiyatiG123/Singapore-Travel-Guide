<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Singapore Travel Guide</title>

    <link rel="stylesheet" href="style.css">
    
</head>

<body>
    <header>
        <h2 class="logo">Singapore Travel Guide</h2>

        <nav>
            <a href="#places">Places</a>
            <a href="#culture">Culture</a>
            <a href="#food">Food</a>
            <a href="#tips">Travel Tips</a>
        </nav>
    </header>

    <main>

        <section class="hero">

            <h1>Explore Singapore</h1>

            <p>
                Discover famous places, delicious food, 
                rich culture and useful travel tips
            </p>

            <button>Explore</button>

        </section>
        <!-- Places Section -->

        <section id="places" class="places">

            <h2>Famous Places</h2>

            <div class="place-container">

                <div class="place-card">
                    <img src="images/placeholder.jpg" alt="Placeholder image">
                    <h3>Marina Bay Sands</h3>
                </div>

                <div class="place-card">
                    <img src="images/placeholder.jpg" alt="Placeholder image">
                    <h3>Merlion Park</h3>
                </div>

                <div class="place-card">
                    <img src="images/placeholder.jpg" alt="Placeholder image">
                    <h3>Gardens by the Bay</h3>
                </div>
        
            </div>

        </section>
    </main>

</body>
</html>
